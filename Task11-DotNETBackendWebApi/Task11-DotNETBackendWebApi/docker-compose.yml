services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=__REMOVED_SQL_PASSWORD__
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P __REMOVED_SQL_PASSWORD__ -C -Q 'SELECT 1'"]
      interval: 10s 
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build: .
    container_name: dot_net_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Task11Db;User Id=sa;Password=__REMOVED_SQL_PASSWORD__;TrustServerCertificate=True
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql_data:
